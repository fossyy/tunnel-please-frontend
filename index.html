<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tunel.live | Free SSH tunnels for local development</title>
    <meta
      name="description"
      content="Create an HTTP/HTTPS or TCP tunnel to your local service with one SSH command. Free hosted servers, no registration required, or self-host Tunnel Please."
    />
    <link rel="preload" href="/src/assets/fonts/plex-sans.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="mx-auto max-w-[680px] px-5 py-12" style="font-family: sans-serif">
        <p>
          tunel.live gives your local app a public HTTP/HTTPS address or TCP endpoint through a free hosted
          SSH tunnel server. No registration required for standard tunnels.
        </p>
        <p>
          The interactive command builder needs JavaScript. A working example:
          <code>ssh sgp.tunel.live -p 2200 -R 443:localhost:8000</code> — run it in your terminal and keep the
          session open; the public address to use is printed there after connecting.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
